name = "employee-tracker-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "Employee Task Tracker"
# Set this to your R2 public bucket URL after enabling public access:
# e.g. https://pub-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.r2.dev
# You can also set it as a secret: wrangler secret put PUBLIC_R2_URL
PUBLIC_R2_URL = "https://pub-f2c39ec5f0c34714944082e313835b0e.r2.dev"

# Secrets — set these via CLI:
# wrangler secret put JWT_SECRET
# wrangler secret put ADMIN_PIN
# wrangler secret put GOOGLE_SERVICE_ACCOUNT_EMAIL
# wrangler secret put GOOGLE_PRIVATE_KEY
# wrangler secret put SPREADSHEET_ID
# wrangler secret put EMPLOYEES_JSON

# R2 bucket — create with: npx wrangler r2 bucket create employee-attachments
# Then enable public access in the Cloudflare dashboard (R2 → bucket → Settings → R2.dev subdomain)
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "employee-attachments"
