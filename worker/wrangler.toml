name = "employee-tracker-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "Employee Task Tracker"

# Secrets — set these via CLI:
# wrangler secret put JWT_SECRET
# wrangler secret put ADMIN_PIN
# wrangler secret put GOOGLE_SERVICE_ACCOUNT_EMAIL
# wrangler secret put GOOGLE_PRIVATE_KEY
# wrangler secret put SPREADSHEET_ID
# wrangler secret put EMPLOYEES_JSON

# R2 bucket for image attachments
# Create with: npx wrangler r2 bucket create employee-attachments
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "employee-attachments"
