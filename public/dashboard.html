<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard — Task Tracker</title>
  <meta name="description" content="Submit and track your tasks in real time. Data syncs to Google Sheets." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bg-animated"></div>
  <div id="toast-container" class="toast-container"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="dashboard.html" class="nav-brand">
        <div class="logo-icon">📊</div>
        <span>Task Tracker</span>
      </a>
      <div class="nav-actions">
        <div class="nav-user">
          <div class="nav-avatar" id="nav-avatar">?</div>
          <span id="nav-name">Loading…</span>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="logout()">Sign out</button>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top:1.5rem; padding-bottom:3rem;">
    <!-- Stats -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-icon stat-icon-blue">📋</div>
        <div><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total Tasks</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon stat-icon-green">✅</div>
        <div><div class="stat-value" id="stat-done">—</div><div class="stat-label">Completed</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon stat-icon-yellow">⏳</div>
        <div><div class="stat-value" id="stat-inprog">—</div><div class="stat-label">In Progress</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon stat-icon-purple">⏱️</div>
        <div><div class="stat-value" id="stat-hours">—</div><div class="stat-label">Total Hours</div></div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="switchTab('submit', this)">➕ Submit Task</button>
      <button class="tab-btn" onclick="switchTab('history', this)">📜 My History</button>
    </div>

    <!-- Submit Tab -->
    <div id="tab-submit" class="tab-panel active">
      <div class="card card-lg animate-in">
        <div class="section-header">
          <div class="section-title">📝 New Task Submission</div>
          <span class="badge badge-info" id="dept-badge">Loading…</span>
        </div>

        <div id="form-alert"></div>

        <form id="submit-form" onsubmit="handleSubmit(event)">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="task-title">Task Title <span class="required">*</span></label>
              <input id="task-title" type="text" class="form-control" placeholder="e.g. Fix login bug" required maxlength="120" />
            </div>
            <div class="form-group">
              <label class="form-label" for="project-code">Project Code</label>
              <input id="project-code" type="text" class="form-control" placeholder="e.g. PROJ-42" maxlength="30" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea id="description" class="form-control" placeholder="Describe what you worked on…" rows="3" maxlength="500"></textarea>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="task-date">Date <span class="required">*</span></label>
              <input id="task-date" type="date" class="form-control" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="hours">Hours Worked</label>
              <input id="hours" type="number" class="form-control" placeholder="e.g. 4.5" min="0.5" max="24" step="0.5" />
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="status">Status <span class="required">*</span></label>
              <select id="status" class="form-control" required>
                <option value="">Select status…</option>
                <option value="In Progress">⏳ In Progress</option>
                <option value="Completed">✅ Completed</option>
                <option value="Blocked">🚫 Blocked</option>
                <option value="Review">👀 Review</option>
                <option value="On Hold">⏸️ On Hold</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="priority">Priority</label>
              <select id="priority" class="form-control">
                <option value="Medium">🟡 Medium</option>
                <option value="High">🔴 High</option>
                <option value="Low">🟢 Low</option>
                <option value="Critical">🚨 Critical</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="notes">Notes / Blockers</label>
            <textarea id="notes" class="form-control" placeholder="Any blockers, dependencies or additional notes…" rows="2" maxlength="300"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="attachment-url">Attachment URL</label>
            <input id="attachment-url" type="url" class="form-control" placeholder="https://drive.google.com/…" />
            <div class="form-hint">Paste a link to any relevant document, screenshot or file</div>
          </div>

          <div class="flex gap-1" style="justify-content:flex-end; flex-wrap:wrap;">
            <button type="button" class="btn btn-secondary" onclick="resetForm()">Clear</button>
            <button type="submit" id="submit-btn" class="btn btn-primary btn-lg">
              <span id="submit-btn-text">Submit Task →</span>
              <span id="submit-spinner" class="spinner hidden"></span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- History Tab -->
    <div id="tab-history" class="tab-panel">
      <div class="card animate-in">
        <div class="section-header">
          <div class="section-title">📜 My Submissions</div>
          <button class="btn btn-secondary btn-sm" onclick="loadHistory()">🔄 Refresh</button>
        </div>
        <div id="history-content">
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <p>No submissions yet. Submit your first task!</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
